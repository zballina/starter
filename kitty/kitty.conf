# ==========================================
# FONTS
# ==========================================
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        20.0

# ==========================================
# COLOR SCHEME: CustomGentoo (from WezTerm)
# ==========================================
background            #000000
foreground            #ffffff

cursor                #aaaaaa
cursor_text_color     #000000

selection_background  #7e57c2
selection_foreground  #ffffff

# ANSI colors
color0  #000000
color1  #aa0000
color2  #00aa00
color3  #aa5500
color4  #3b82f6
color5  #54487a
color6  #00aaaa
color7  #aaaaaa

# Bright colors
color8  #555555
color9  #ff5555
color10 #73d216
color11 #ffff55
color12 #5555ff
color13 #6e56af
color14 #55ffff
color15 #ffffff

# ==========================================
# WINDOW & APPEARANCE
# ==========================================
background_opacity         0.90
background_blur            20
hide_window_decorations    no
window_padding_width       4
enable_audio_bell          no
confirm_os_window_close    0

# ==========================================
# TAB BAR
# ==========================================
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{title}"

# ==========================================
# MACOS SPECIFIC INTEGRATION
# ==========================================
macos_option_as_alt         yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in  window

# ==========================================
# KEYBINDINGS
# ==========================================
# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Tab management
map cmd+t new_tab
map cmd+w close_tab

# Image Paste from Clipboard (Antigravity workflow)
map cmd+shift+v kitten paste_clipboard_image.py

# Navigation matching WezTerm / macOS standards
map cmd+left      send_text all \x01
map cmd+right     send_text all \x05
map alt+left      send_text all \x1bb
map alt+right     send_text all \x1bf
map alt+backspace send_text all \x17
map cmd+backspace send_text all \x15

# Spanish Latin American Layout: Opt+Q -> @
map alt+q send_text all @
